name: Supabase keep-alive ping

on:
  schedule:
    # 매일 UTC 00:00(한국시간 09:00) 1회. Supabase 무료 프로젝트가 7일간 DB
    # 활동이 없으면 일시정지되는 것을 막기 위한 가벼운 select 핑.
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sf "${SUPABASE_URL}/rest/v1/trips?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null -w "HTTP %{http_code}\n"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
